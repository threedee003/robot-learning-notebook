<script>
  (function () {
    var KEY = "rlb-theme";
    var fallback = "{{ site.book_default_scheme | default: 'auto' }}";
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = stored || (fallback === "auto" ? (prefersDark ? "dark" : "light") : fallback);
    var link = document.querySelector('link[rel="stylesheet"]');
    if (link) { link.setAttribute("href", "{{ '/assets/css/just-the-docs-' | relative_url }}" + theme + ".css"); }
    document.documentElement.setAttribute("data-theme", theme);
    window.rlbTheme = {
      key: KEY,
      get: function () { return document.documentElement.getAttribute("data-theme") || "light"; },
      set: function (t) {
        var l = document.querySelector('link[rel="stylesheet"]');
        if (l) { l.setAttribute("href", "{{ '/assets/css/just-the-docs-' | relative_url }}" + t + ".css"); }
        document.documentElement.setAttribute("data-theme", t);
        try { localStorage.setItem(KEY, t); } catch (e) {}
        document.dispatchEvent(new CustomEvent("rlb:themechange", { detail: t }));
      }
    };
  })();
</script>
