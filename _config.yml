# ---------------------------------------------------------------
# Robot Learning Notebook  |  site settings
# Edit the values in this first block. Restart `jekyll serve`
# after any change to this file.
# ---------------------------------------------------------------
title: Robot Learning Notebook
description: >-
  A hands-on technical book on generative policies for robotics.
  Diffusion Policy, flow matching, and the engineering that makes them work.
author: Tribikram
baseurl: ""            # e.g. "/robot-learning-book" when hosted at username.github.io/robot-learning-book
url: ""                # e.g. "https://username.github.io"
lang: en-US

# Link shown at the top right of every page. Remove or edit freely.
aux_links:
  "Source on GitHub":
    - "https://github.com/threedee003/robot-learning-book"
aux_links_new_tab: true

# "Edit this page" link in the footer. Set your repo, or set gh_edit_link to false.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/threedee003/robot-learning-book"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

footer_content: >-
  Written by Tribikram. Built with the <a href="https://github.com/just-the-docs/just-the-docs">Just the Docs</a> theme (MIT license).

# ---------------------------------------------------------------
# Book behaviour. You rarely need to touch anything below.
# ---------------------------------------------------------------
permalink: pretty

# Default colour scheme on first visit. Readers can switch with the
# moon/sun button, and their choice is remembered. "auto" follows the OS.
book_default_scheme: auto   # auto | light | dark
color_scheme: light

# Every page under chapters/ and appendix/ gets the book layout automatically,
# so new markdown files only need title, parent and nav_order.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      math: true
  - scope:
      path: "chapters"
      type: pages
    values:
      book_page: true
  - scope:
      path: "appendix"
      type: pages
    values:
      book_page: true

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - scripts/
  - README.md
  - LICENSE.txt
  - "**/_TEMPLATE.md"
  - "**/__pycache__/"

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 6
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

enable_copy_code_button: true
heading_anchors: true
nav_enabled: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

mermaid:
  version: "10.9.1"

callouts:
  definition:
    title: Definition
    color: blue
  intuition:
    title: Intuition
    color: purple
  key:
    title: Key idea
    color: green
  warning:
    title: Pitfall
    color: red
  exercise:
    title: Exercise
    color: yellow
  note:
    title: Note
    color: blue

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap

kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    block:
      line_numbers: false

liquid:
  error_mode: strict
  strict_filters: true

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

sass:
  quiet_deps: true
  silence_deprecations: ['import']
